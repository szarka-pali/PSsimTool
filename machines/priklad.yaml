# Referenčná definícia stroja. Zodpovedá osiam, ktoré generuje `pssim mock-server`,
# takže sa dá spustiť bez PLC aj bez CAD súboru (na import geometrie ho ešte treba).
#
# Kompletná schéma vrátane všetkých polí:
#   .claude/skills/domenovy-kontext/referencie/opcua-mapovanie.md

machine: priklad
description: Portálový paletizátor — dve lineárne osi a otočná hlava

# --- geometria -------------------------------------------------------------
step_file: models/priklad.step
units: mm
tessellation:
  linear_deflection_mm: 0.5
  angular_deflection_rad: 0.35

# --- pripojenie ------------------------------------------------------------
# POZOR: endpoint tu je LOKÁLNY MOCK. Reálne endpointy patria do prostredia
# (PSSIM_OPCUA_ENDPOINT) alebo na CLI — tento súbor je verzovaný.
source:
  endpoint: opc.tcp://localhost:4840/pssim/
  publishing_interval_ms: 50
  stale_after_s: 1.0

# --- kinematika ------------------------------------------------------------
joints:
  # Pozdĺžny pojazd portálu. PLC posiela mm → scale 0.001.
  - name: os_x
    parent: base
    child: portal
    type: prismatic
    axis: [1, 0, 0]
    limits: [0.0, 2.5]
    signal:
      node: "ns=2;s=Axes.X.ActPos"
      scale: 0.001

  # Zdvih. Vozík je potomkom portálu, takže sa hýbe spolu s ním.
  - name: os_z
    parent: portal
    child: portal/vozik
    type: prismatic
    axis: [0, 0, 1]
    limits: [0.0, 0.8]
    origin:
      xyz: [0.0, 0.0, 0.15]
    signal:
      node: "ns=2;s=Axes.Z.ActPos"
      scale: 0.001

  # Otočná hlava. Servo posiela tisíciny stupňa → scale = pi/180/1000.
  - name: os_c
    parent: portal/vozik
    child: portal/vozik/hlava
    type: revolute
    axis: [0, 0, 1]
    limits: [-3.14159265, 3.14159265]
    signal:
      node: "ns=2;s=Axes.C.ActPos"
      scale: 1.7453292519943296e-05

  # Kryt sa nehýbe — je tu len kvôli pevnému offsetu v hierarchii.
  - name: kryt
    parent: base
    child: kryt
    type: fixed
    origin:
      xyz: [0.0, -0.4, 0.0]
