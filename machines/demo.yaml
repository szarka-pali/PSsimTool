# A runnable demo — the one machine definition that works without real CAD.
#
# It uses the test fixture (tests/data/fixture.step) and the signals
# `pssim mock-server` generates. It serves to verify that the whole chain runs:
#
#   mock server → OPC UA → StateStore → kinematics → Panda3D
#
# For a real machine, make your own file following machines/example.yaml.

machine: demo
description: A demo on the fixture geometry, driven by the mock server

step_file: tests/data/fixture.step
units: mm
tessellation:
  linear_deflection_mm: 0.5
  angular_deflection_rad: 0.35

source:
  endpoint: opc.tcp://localhost:4840/pssim/
  publishing_interval_ms: 50
  stale_after_s: 1.0

joints:
  # The portal travels along X. The mock sends mm in the range 50-2450.
  - name: axis_x
    parent: base
    child: base/portal
    type: prismatic
    axis: [1, 0, 0]
    limits: [0.0, 2.5]
    signal:
      node: "ns=2;s=Axes.X.ActPos"
      scale: 0.001

  # The second part of the portal moves up and down. The mock sends mm in the
  # range 50-750.
  - name: axis_z
    parent: base/portal
    child: base/portal/Part1[2]
    type: prismatic
    axis: [0, 0, 1]
    limits: [0.0, 0.8]
    signal:
      node: "ns=2;s=Axes.Z.ActPos"
      scale: 0.001

  # The head rotates. The mock sends thousandths of a degree (±90 000).
  - name: axis_c
    parent: base/portal
    child: base/portal/head
    type: revolute
    axis: [0, 0, 1]
    limits: [-3.14159265, 3.14159265]
    signal:
      node: "ns=2;s=Axes.C.ActPos"
      scale: 1.7453292519943296e-05

  # The cover is fixed — it is here so the demo contains static geometry too.
  - name: cover
    parent: base
    child: base/cover
    type: fixed
